# Theme settings
remote_theme: allejo/jekyll-docs-theme

# Project information
name: mmsusie
description: "Mixed-model SuSiE fine-mapping — GRM-adjusted (GLS) sum-of-single-effects fine-mapping, dense or sparse, with full covariate (Frisch–Waugh–Lovell) adjustment and GxE support."

project:
  version: 1.0.0
  download_url: https://github.com/chaoning/mmsusie
  download_text: "View on GitHub"

# License information
license:
  software: GPL-3.0
  software_url: https://www.gnu.org/licenses/gpl-3.0.html

collections:
  documentation:
    output: true
    permalink: /documentation/:name/

# Navigation menu
nav:
  - title: "Installation"
    url: /documentation/02_installation/
  - title: "Tutorial"
    url: /documentation/03_Tutorial/

# Navigation links
links:
  header:
    - title: GitHub
      icon: github
      brand: true
      url: https://github.com/chaoning/mmsusie
  homepage:
    - title: "View on GitHub"
      icon: github
      brand: true
      url: https://github.com/chaoning/mmsusie
  footer:
    - title: GitHub
      icon: github
      brand: true
      url: https://github.com/chaoning/mmsusie
    - title: Report Issues
      icon: bug
      url: https://github.com/chaoning/mmsusie/issues

# UI theme settings
ui:
  mode: 'auto'  # Options: 'auto', 'dark', 'light'
  brand:
    dark: "#3fc7b4"   # teal brand for dark mode
    light: "#0d7a6c"  # deep teal brand for light mode
  border_color:
    dark: "#4a5a54"
    light: "#d7dedb"  # slightly cool border to match the teal scheme
  header:
    trianglify: true
    dark:
      color1: "#0a201c"  # deep teal-black
      color2: "#1f6f63"  # teal
    light:
      color1: "#0a2a26"  # deep teal
      color2: "#1f7d70"  # teal
  masthead:
    color:
      dark: "#ffffff"
      light: "#ffffff"
    align:
      homepage: "center"
      page: "left"

# Social media links
social:
  github:
    user: chaoning
    repo: mmsusie
  twitter:
    enabled: false
  facebook:
    enabled: false

# Markdown parser
markdown: kramdown

# Exclude unnecessary files to improve build performance
exclude:
  - LICENSE.md
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
